[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "growth-agent"
version = "0.1.0"
description = "通用用增外呼 Agent：多场景客户增长"
requires-python = ">=3.11,<3.12"
dependencies = [
  "agentscope @ git+https://github.com/agentscope-ai/agentscope.git@e4c1e074dee3f0f6cca28ca29e934c4ec0605354",
  "fastapi>=0.115,<1",
  "anyio>=4,<5",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "PyYAML>=6,<7",
  "python-dotenv>=1,<2",
  "fastembed>=0.7,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.4,<1",
  "beautifulsoup4>=4.13,<5",
  "pypdf>=5,<7",
  "json-repair>=0.55,<1",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "jsonschema>=4.23,<5"]

[project.scripts]
growth = "backend.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend", "evaluation"]
exclude = ["evaluation/reports/**"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

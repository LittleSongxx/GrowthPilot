name: growthpilot

services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    environment:
      POSTGRES_DB: growth
      POSTGRES_USER: growth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-growth_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growth -d growth"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    image: growthpilot:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql://growth:${POSTGRES_PASSWORD}@postgres:5432/growth
      DATABASE_SCHEMA: growth
      # 仅用于本地端口映射：容器内客户端地址是网桥网关，Host/Origin 仍限本机。
      GROWTH_ALLOW_PROXY_CLIENT: "1"
    ports:
      - "127.0.0.1:${GROWTH_APP_PORT:-8787}:8787"
    volumes:
      - growthpilot_runtime:/app/.run
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  growthpilot_runtime:

schema_version: '2.0'
scenario:
  id: meituan_rider
  version: '8.2'
  title: 美团骑手下载与报名引导
  industry: 配送
  brand: 美团
  language: zh-CN
  mode: conversation
identity:
  role: 美团外卖骑手用户增长客服
  app_name: 美团骑手 App
  background: 当前客户是有意成为美团外卖骑手的潜在客户。
  opening: 您好，我是骑手报名服务助手，可以帮您了解配送要求、当地站点和用车信息，以及下载报名步骤，现在方便交流吗？
  tone: 简洁、尊重自愿、先解答当前疑问、一次问一个关键问题
  disclosure: 我可以帮您了解政策、当地服务和 App 操作步骤；费用与收入测算会说明计算条件，查不到的信息会直接说明。
objective:
  description: 理解客户配送需求，解答资格、当地站点、计酬和车辆成本等顾虑，在客户愿意时指导下载骑手 App、注册报名及了解首次配送的准备步骤。
  stages:
  - 了解需求
  - 解答顾虑
  - 引导下载注册
  - 指导首次使用
  completion_basis: customer_statement
customer_fields:
- id: area
  type: string
  description: 客户明确表达的城市、区县或地标；城市级地点即可查询，缺少地点或同时涉及多城时澄清，不假定定位或距离
  semantic_version: '2'
  allow_unknown: true
  ttl_seconds: 2592000
  max_length: 200
- id: work_mode
  type: enum
  description: 客户明确表达的兼职或全职意向
  semantic_version: '1'
  allow_unknown: true
  ttl_seconds: 2592000
  values:
  - 兼职
  - 全职
  - 尚未决定
- id: materials_ready
  type: boolean
  description: 客户自述的申请资料准备情况；不是后台审核状态
  semantic_version: '1'
  allow_unknown: true
  ttl_seconds: 2592000
- id: delivery_type
  type: string
  description: 客户选择或咨询的配送类型；兼职不等于众包
  semantic_version: '1'
  allow_unknown: true
  ttl_seconds: 2592000
  max_length: 200
- id: has_vehicle
  type: boolean
  description: 客户是否已有可用车辆
  semantic_version: '1'
  allow_unknown: true
  ttl_seconds: 2592000
- id: concern
  type: string
  description: 客户当前最关心的问题
  semantic_version: '1'
  allow_unknown: true
  ttl_seconds: 2592000
  max_length: 200
business_data:
  ref: catalog.json
  source_type: local_catalog
tools:
- id: search_policy
  adapter: local
- id: send_download_sms
  adapter: local
- id: search_nearby_stations
  adapter: local
- id: query_delivery_pay
  adapter: local
- id: search_vehicle_rentals
  adapter: local
- id: estimate_work_budget
  adapter: local
skills:
- id: meituan-rider-work-fit
  ref: ../../agent_harness/skills/meituan_rider/meituan-rider-work-fit/SKILL.md
  version: '1'
  description: 根据可跑时段、出勤稳定性和安排偏好，比较配送模式并识别时间冲突
  required_tools:
  - search_policy
  - search_nearby_stations
- id: meituan-rider-cost-planning
  ref: ../../agent_harness/skills/meituan_rider/meituan-rider-cost-planning/SKILL.md
  version: '1'
  description: 拆解计酬与车辆成本，按客户确认条件测算月收支和覆盖成本的收入门槛
  required_tools:
  - search_policy
  - query_delivery_pay
  - search_vehicle_rentals
  - estimate_work_budget
- id: meituan-rider-rental-choice
  ref: ../../agent_harness/skills/meituan_rider/meituan-rider-rental-choice/SKILL.md
  version: '1'
  description: 对照试跑期限、现金预算和电池需求比较电动车租赁方案，识别遗漏费用
  required_tools:
  - search_policy
  - search_vehicle_rentals
- id: meituan-rider-protection
  ref: ../../agent_harness/skills/meituan_rider/meituan-rider-protection/SKILL.md
  version: '1'
  description: 区分职业伤害保障、社保补贴和家庭大病关怀，解释公开资料的适用条件
  required_tools:
  - search_policy
- id: meituan-rider-onboarding
  ref: ../../agent_harness/skills/meituan_rider/meituan-rider-onboarding/SKILL.md
  version: '1'
  description: 按配送类型梳理报名条件、材料缺口与当前准备步骤，不推断个人审核结果
  required_tools:
  - search_policy
  - send_download_sms
policies:
  prohibited_promises:
  - 保证收入
  - 保证订单量
  - 保证资格或审批
  - 承诺个人额度、利率或放款
  - 把估算金额、参考价格或未确认条件当作客户实际报价或合同
  - 把客户自述进展称作已核验注册或办理成功
  tool_timeout_seconds: 10
  session_timeout_seconds: 300
evaluation: {}

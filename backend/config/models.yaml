schema_version: '2.0'
# 文本请求统一走 OpenAI Chat Completions，模型和地址按用途配置。
# 密钥只放服务端环境变量；普通字段可由同用途的环境变量覆盖。
agent:
  model: deepseek-flash
  base_url: https://api.deepseek.com
  temperature: 0.0
  max_tokens: 700
  max_tokens_param: max_tokens
  reasoning_effort: null
  extra_body: {}
  max_iterations: 8
# 下面三组连接留空时沿用 agent；生成参数各自独立，不继承。
judge:
  model: null
  base_url: null
  temperature: 0.0
  max_tokens: 16384
  max_tokens_param: max_tokens
  reasoning_effort: null
  extra_body: {}
customer:
  model: null
  base_url: null
  temperature: 0.7
  max_tokens: 700
  max_tokens_param: max_tokens
  reasoning_effort: null
  extra_body: {}
profile:
  model: null
  base_url: null
  temperature: 0.0
  max_tokens: 3000
  max_tokens_param: max_tokens
  reasoning_effort: null
  extra_body: {}
voice:
  provider: dashscope
  asr_model: qwen3-asr-flash
  tts_model: qwen3-tts-flash
  credential_env: DASHSCOPE_API_KEY
  endpoint_env: DASHSCOPE_BASE_URL
  voice: Cherry
budgets:
  session_max_seconds: 300

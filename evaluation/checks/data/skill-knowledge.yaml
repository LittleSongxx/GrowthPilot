version: skill-knowledge-v1
frozen_at: '2026-10-30'
purpose: 17份问题SOP涉及的公开知识依赖复验。题集在一次真实构建和缺项审阅后形成，不代表盲测准确率；活动目录、收入与订单条件测算另由工具验证。
review_rules:
  supported: 当次实际返回正文可回答本题，保留地区、时间、主体和条件。
  partial: 只覆盖部分要求，或有正文但必要条件/步骤仍缺失。
  gap: 核心问题无实际返回正文；承认未知不等于覆盖通过。
  evidence_boundary: 每题独立检索。可另建补查报告，不能借其他题证据回填为本题完整命中；scope_note不是官方原文。
  tool_only_skills: meituan-merchant-offer-fit依赖活动目录；didi-driver-work-budget依赖客户输入和确定性预算工具，不因没有对应政策题而推定能力缺失。
questions:
- id: rider-work-fit
  scenario: meituan_rider
  question: 美团众包和专送的时间安排、报名方式有什么区别？我只能晚上跑两个小时。
  review_notes: meituan-rider-work-fit：正文应区分众包自主安排与专送站点安排；客户时间偏好只是适配条件，不代表当地可开通。
- id: rider-onboarding
  scenario: meituan_rider
  question: 做美团众包需要什么报名条件和资料？健康证明是否必须？
  review_notes: meituan-rider-onboarding：检查健康证明与公开报名条件；返回条件不得冒充全部材料或当前上传顺序，完整材料清单不足应标partial。
- id: rider-cost-components
  scenario: meituan_rider
  question: 骑手配送收入由什么组成？基础配送费和临时补贴有什么区别，能保证我每天有多少单吗？
  review_notes: meituan-rider-cost-planning：解释基础配送费、临时补贴和变动因素；历史收入和案例不得变成个人收入或单量预测。收支计算另由工具验收。
- id: rider-rental-boundary
  scenario: meituan_rider
  question: 美团众包和专送的电动车由谁准备？报名费是不是免费，租车是否也免费？
  review_notes: meituan-rider-rental-choice：区分报名费、众包自备交通工具和专送站点沟通；不把不收报名费扩展成车辆租赁免费，报价由本地目录承接。
- id: rider-protection-current
  scenario: meituan_rider
  question: 美团骑手新职业伤害保障2026年7月1日后覆盖哪些地区，由谁交保费？每单必保等于什么事故都赔吗？
  review_notes: meituan-rider-protection：需实际返回2026年7月1日起全国覆盖与平台缴费正文；旧17省披露不能当现行范围，不据宣传口号推定个人参保或任何事故均赔。
- id: rider-protection-family
  scenario: meituan_rider
  question: 骑手家庭大病关怀计划的住院诊疗补充保障有什么条件？全国所有骑手和家人都能报销吗？
  review_notes: meituan-rider-protection：同时保留稳定跑单、直营城市、涵盖疾病、自付费用超过5000元部分及按规则报销；案例不是个人待遇。
- id: merchant-admission
  scenario: meituan_merchant
  question: 实体餐馆入驻美团外卖，需要哪些经营资质？食品经营许可证只有45天到期可以首次提交吗？
  review_notes: meituan-merchant-admission：食品经营许可当前原文阈值大于30天；与身份证有效期大于60天分开。证照类别、主体一致性和照片缺项分别检查，不承诺审核。
- id: merchant-admission-photos
  scenario: meituan_merchant
  question: 美团外卖餐饮商家入驻，身份证和门店照片要求是什么？
  review_notes: meituan-merchant-admission：需身份证件及门脸、环境图片正文；环境图如上传是条件，不能改写成所有材料统一必交；不收集真实证件。
- id: merchant-delivery-choice
  scenario: meituan_merchant
  question: 商家选择美团配送和自配送，技术服务费与履约服务费有什么区别？自配送还要付配送成本吗？
  review_notes: meituan-merchant-delivery-choice：技术与履约费用分开；自配送第三方费用仍存在。历史6%-8%不是当前报价，配送覆盖不等于具体忙时履约能力。
- id: merchant-order-economics
  scenario: meituan_merchant
  question: 美团免费开店是不是订单不收服务费？技术服务费的计费基数、实际费率应该在哪里确认？
  review_notes: meituan-merchant-order-economics：免费开店与完成订单服务费分开；实际费率商家中心确认，企业客户配送基数不得外推普通商户。计算能力另验。
- id: didi-national-eligibility
  scenario: didi_driver
  question: 加入滴滴做网约车司机，驾驶证、驾龄、背景记录和驾驶员证有哪些基础条件？
  review_notes: didi-driver-eligibility：驾驶证、驾龄、平台记录条件和法定双证逐项核对；平台原文与全国法规不混同，不能认定个人已通过。
- id: didi-national-background
  scenario: didi_driver
  question: 国家网约车管理规定中，驾驶员无犯罪记录、无吸毒、无饮酒驾驶记录和记分要求是什么？
  review_notes: didi-driver-eligibility：全国背景与记分条款应真正返回正文，不能只用第十条或第十四条标题；平台更严规则另标。
- id: didi-fuzhou-person
  scenario: didi_driver
  question: 福州网约车驾驶员年龄要求是什么，未超过法定退休年龄能直接说成60岁以下吗？
  review_notes: didi-driver-eligibility：福州年龄原文是未超过国家法定退休年龄；不能擅转固定60岁，户籍/居住未明文不得推定无要求。
- id: didi-fuzhou-experience
  scenario: didi_driver
  question: 福州网约车驾驶员取得相应准驾车型驾驶证需要几年驾驶经历？
  review_notes: didi-driver-eligibility：应实际返回福州三年以上驾驶经历条款，不能只因全国或异地条款相似而替代。
- id: didi-fuzhou-car-age
  scenario: didi_driver
  question: 福州网约车初次登记日期距离申请日期不得超过多少年？
  review_notes: didi-driver-eligibility：应返回福州车辆登记日起不得超过3年含的正文；杭州出租客运例外不得移用于福州。
- id: didi-fuzhou-car-details
  scenario: didi_driver
  question: 福州网约车牌照、座位数、车辆轴距、排量和新能源车辆条件是什么？
  review_notes: didi-driver-eligibility：福州购置价、轴距排量和新能源分支按原文；未返回牌照/座位要求则逐项标缺，不拼接杭州条件。
- id: didi-hangzhou-vehicle
  scenario: didi_driver
  question: 杭州网约车车辆是否必须新能源新车，有什么轴距和牌照要求？已经登记为出租客运的车有什么例外？
  review_notes: didi-driver-eligibility：区分新车一般准入与市区出租客运未超3年的例外；新能源纯电与非新能源纯电分支不得压成必须新能源。
- id: didi-hangzhou-residence
  scenario: didi_driver
  question: 杭州申请网约车驾驶员证需要本地户籍或居住证吗？
  review_notes: didi-driver-eligibility：故意保留地方覆盖缺口；现细则仅引用杭州市客运出租汽车管理条例，未得到该条款不能推断户籍或居住条件。
- id: didi-rental-scope
  scenario: didi_driver
  question: 滴滴网约车车辆租赁商家与司机用户纠纷处理规则，受理期限与适用范围是什么？
  review_notes: didi-driver-rental-choice：核对V202307合作商家、平台租车合同及受理范围；只有范围没有期限时仍标partial，不外推线下任意合同。
- id: didi-rental-voluntary-return
  scenario: didi_driver
  question: 滴滴租赁车辆司机主动提前退车，应按什么租赁合同条款核对违约金和押金？
  review_notes: didi-driver-rental-choice：主动退租不能套出险收车或违约强制收车的20%条款；实际合同未知不计算损失，保留租期冲突识别。
- id: didi-onboarding
  scenario: didi_driver
  question: 在福州申请网约车驾驶员证，从哪里报名、考试、查询结果？这些步骤是否等于滴滴平台注册通过？
  review_notes: didi-driver-onboarding：保留福州指南403的可复验缺口；不能拿厦门考试、全国法律时限或订单申诉说明代替福州报名/查结果入口。
- id: financial-trust-fee
  scenario: financial_consultation
  question: 有钱花申请额度收费吗，人工能保证提额或干预审批结果吗？官方客服电话是什么？
  review_notes: financial-trust-check：需免费申请、人工无法干预额度、95055官方核验正文；不要以代理自称官方或最快到账宣传替代真实性核验。
- id: financial-trust-check
  scenario: financial_consultation
  question: 有人自称度小满让我先交钱保证提额，还有第三方声称能代办停息挂账，怎样核实？
  review_notes: financial-trust-check：第三方债务代理的官方反欺诈警示与提额问题分开；2024专线与奖励是历史安排，不承诺当前代理维权或奖励。
- id: financial-register
  scenario: financial_consultation
  question: 有钱花注册账户时需要收集什么信息？仅仅注册就需要提交信贷服务材料吗？
  review_notes: financial-authorization：资料阶段分开；现政策主要是账号关联登录与信贷实名，不能编造统一注册只需手机号、注册全无信息采集。
- id: financial-borrow-stage
  scenario: financial_consultation
  question: 有钱花获取额度后，借款申请和贷款实际发放是什么关系？
  review_notes: financial-authorization：需额度不等于实际资金、借款申请与发放的分段正文；银行模板仅限资方渠道，不冒充统一页面路径或个人借款状态。
- id: financial-free-application
  scenario: financial_consultation
  question: 有钱花免费申请、无年费无管理费是什么意思？借款是否另外计息？
  review_notes: financial-cost-explanation：免费申请不等于借款无息；息费条款保留对应银行、渠道与条件，条件测算工具另行验收。
- id: financial-early-repayment
  scenario: financial_consultation
  question: 有钱花提前还款一定免费吗？江苏银行和南京银行公开模板中的还款模式、锁定期和费用能套用到我吗？
  review_notes: financial-cost-explanation：江苏银行/南京银行模板的锁定期和还款模式分开；占位值不是个人合同，不能承诺统一免费提前还款。
- id: financial-debit-authorization
  scenario: financial_consultation
  question: 度小满支付授权扣款协议中的扣款授权范围、撤销和借款还款义务是什么关系？能认定所有有钱花借款都开了代扣吗？
  review_notes: financial-authorization：区分支付授权、特定第三方及贷款义务；终止授权的条件与渠道要有正文，不推出所有有钱花借款均已代扣。
- id: financial-offer-boundary
  scenario: financial_consultation
  question: 有钱花的广告利率或新用户优惠能代表我的个人实际利率、最终额度和资格吗？
  review_notes: financial-offer-fit：RAG只辅助解释审批与个人费率边界；具体优惠资格、期限、归属产品由本地目录承接，不能以此题声称活动规则完整覆盖。
- id: financial-account-login
  scenario: financial_consultation
  question: 有钱花账号关联以及登录会收集哪些个人信息，和信贷服务实名、风险评估信息是否相同？
  review_notes: financial-authorization：账号关联登录、信贷实名及风险评估各自条件需实际返回；登录条款不可描述为所有注册方式完整指南。
